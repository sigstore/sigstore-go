name: Update embedded TUF data

on:
  schedule:
    # Daily, 13:13 UTC
    - cron: "13 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update-embedded-root:
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Update embedded TUF data via the TUF client
        run: make update-embedded-root

      - name: Open a pull request if the embedded data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add \
            pkg/tuf/repository/root.json \
            pkg/tuf/repository/staging_root.json \
            examples/trusted-root-public-good.json \
            examples/signing_config.v0.2.json

          if git diff --cached --quiet; then
            echo "No changes to embedded TUF data."
            exit 0
          fi

          BRANCH="automation/update-embedded-tuf-data"
          TITLE="Bump embedded TUF roots and example trust data"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          git checkout -B "$BRANCH"
          git commit -s -m "$TITLE"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file - <<'EOF'
          The Sigstore TUF repositories have changed: this refreshes the TUF roots embedded in `pkg/tuf/repository/` (`root.json` and `staging_root.json`) as well as the `trusted_root.json` and `signing_config.v0.2.json` targets in `examples/`.

          Generated by running the repository's own TUF client:

          ```
          make update-embedded-root
          ```

          Please review before merging.
          EOF
          else
            echo "Updated existing pull request #$EXISTING_PR"
          fi
