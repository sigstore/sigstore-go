name: Update embedded TUF data

on:
  schedule:
    # Daily, 13:13 UTC
    - cron: "13 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update-embedded-root:
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Update embedded TUF data via the TUF client
        run: make update-embedded-root

      - name: Open a pull request if the embedded data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=(
            pkg/tuf/repository/root.json
            pkg/tuf/repository/staging_root.json
            pkg/tuf/repository/pqc_staging_root.json
            examples/trusted-root-public-good.json
            examples/signing_config.v0.2.json
          )

          git add "${FILES[@]}"

          if git diff --cached --quiet; then
            echo "No changes to embedded TUF data."
            exit 0
          fi

          gh auth setup-git

          OPEN_PRS=$(gh pr list \
            --base main \
            --state open \
            --app github-actions \
            --json number,headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | test("^automation/update-embedded-tuf-data-[0-9]+$")))] | sort_by(.number) | reverse')

          LATEST_PR=$(jq -r '.[0].number // empty' <<<"$OPEN_PRS")
          LATEST_BRANCH=$(jq -r '.[0].headRefName // empty' <<<"$OPEN_PRS")

          if [ -n "$LATEST_PR" ] && git fetch origin -- "$LATEST_BRANCH"; then
            if git diff --cached --quiet FETCH_HEAD -- "${FILES[@]}"; then
              echo "Existing pull request #$LATEST_PR already contains these changes."
              exit 0
            fi
          fi

          BRANCH="automation/update-embedded-tuf-data-$(date +%s)"
          TITLE="Bump embedded TUF roots and example trust data"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git commit -s -m "$TITLE"
          git push origin "$BRANCH"

          PR_BODY=$(mktemp)
          cat <<'EOF' >"$PR_BODY"
          The Sigstore TUF repositories have changed: this refreshes the TUF roots embedded in `pkg/tuf/repository/` (`root.json`, `staging_root.json`, and `pqc_staging_root.json`) as well as the `trusted_root.json` and `signing_config.v0.2.json` targets in `examples/`.

          Generated by running the repository's own TUF client:

          ```
          make update-embedded-root
          ```

          Please review before merging.
          EOF

          NEW_PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$PR_BODY")
          rm -f "$PR_BODY"
          echo "Created pull request $NEW_PR_URL"

          for OLD_PR in $(jq -r '.[].number' <<<"$OPEN_PRS"); do
            gh pr close "$OLD_PR" --delete-branch --comment "Superseded by $NEW_PR_URL" || true
          done
